version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: price_aggregator_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: price_aggregator_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=price_aggregator
      - APIFY_TOKEN=${APIFY_TOKEN:-}
      - FB_MARKETPLACE_CITY=medan
      - CAROUSELL_MARKET=id
    depends_on:
      - mongodb

volumes:
  mongo_data:
